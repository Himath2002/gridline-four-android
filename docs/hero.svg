<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Gridline Four Android portfolio hero</title>
  <desc id="description">Gridline Four branding beside a precise seven-column game board and three engineering highlights.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173F38" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1440" height="760" rx="32" fill="#F1F6F3" />
  <circle cx="1260" cy="104" r="176" fill="#D9EFE8" />
  <circle cx="1374" cy="648" r="214" fill="#FFE7DF" />

  <g transform="translate(78 74)">
    <rect width="70" height="70" rx="22" fill="#0F766E" />
    <circle cx="22" cy="35" r="8" fill="#FF715B" />
    <circle cx="48" cy="22" r="8" fill="#F3C64F" />
    <circle cx="48" cy="48" r="8" fill="#FF715B" />
    <path d="M35 12v46" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <text x="94" y="22" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">LOCAL STRATEGY • ANDROID</text>
  </g>

  <g transform="translate(78 190)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" fill="#15231F" font-size="64" font-weight="800">Gridline Four</text>
    <text x="0" y="60" fill="#17483F" font-size="30" font-weight="650">Four in line. One move ahead.</text>
    <text x="0" y="112" fill="#56645F" font-size="20">A configurable four-in-a-row game with local profiles,</text>
    <text x="0" y="144" fill="#56645F" font-size="20">a tactical computer opponent, and a testable rules core.</text>

    <g transform="translate(0 190)" font-size="14" font-weight="700">
      <rect width="118" height="40" rx="20" fill="#D7F2E8" />
      <text x="59" y="26" text-anchor="middle" fill="#0F766E">ANDROID 24+</text>
      <rect x="130" width="90" height="40" rx="20" fill="#FFE5DD" />
      <text x="175" y="26" text-anchor="middle" fill="#B8402E">JAVA 17</text>
      <rect x="232" width="132" height="40" rx="20" fill="#FFF3C8" />
      <text x="298" y="26" text-anchor="middle" fill="#6B5600">PURE ENGINE</text>
    </g>
  </g>

  <g transform="translate(790 76)" filter="url(#shadow)">
