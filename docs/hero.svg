    <text x="34" y="54" fill="#15231F" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">CLASSIC BOARD • 6 × 7</text>
    <text x="526" y="54" text-anchor="end" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">ARIA TO MOVE</text>
    <rect x="34" y="82" width="492" height="344" rx="24" fill="#173F38" />

    <g fill="#DDE8E3">
      <circle cx="77" cy="125" r="22"/><circle cx="145" cy="125" r="22"/><circle cx="213" cy="125" r="22"/><circle cx="281" cy="125" r="22"/><circle cx="349" cy="125" r="22"/><circle cx="417" cy="125" r="22"/><circle cx="485" cy="125" r="22"/>
      <circle cx="77" cy="177" r="22"/><circle cx="145" cy="177" r="22"/><circle cx="213" cy="177" r="22"/><circle cx="281" cy="177" r="22"/><circle cx="349" cy="177" r="22"/><circle cx="417" cy="177" r="22"/><circle cx="485" cy="177" r="22"/>
      <circle cx="77" cy="229" r="22"/><circle cx="145" cy="229" r="22"/><circle cx="213" cy="229" r="22"/><circle cx="281" cy="229" r="22"/><circle cx="349" cy="229" r="22"/><circle cx="417" cy="229" r="22"/><circle cx="485" cy="229" r="22"/>
      <circle cx="77" cy="281" r="22"/><circle cx="145" cy="281" r="22"/><circle cx="213" cy="281" r="22"/><circle cx="281" cy="281" r="22"/><circle cx="349" cy="281" r="22"/><circle cx="417" cy="281" r="22"/><circle cx="485" cy="281" r="22"/>
      <circle cx="77" cy="333" r="22"/><circle cx="145" cy="333" r="22"/><circle cx="213" cy="333" r="22"/><circle cx="281" cy="333" r="22"/><circle cx="349" cy="333" r="22"/><circle cx="417" cy="333" r="22"/><circle cx="485" cy="333" r="22"/>
      <circle cx="77" cy="385" r="22"/><circle cx="145" cy="385" r="22"/><circle cx="213" cy="385" r="22"/><circle cx="281" cy="385" r="22"/><circle cx="349" cy="385" r="22"/><circle cx="417" cy="385" r="22"/><circle cx="485" cy="385" r="22"/>
    </g>
    <g>
      <circle cx="77" cy="385" r="22" fill="#FF715B" />
      <circle cx="145" cy="385" r="22" fill="#F3C64F" />
      <circle cx="213" cy="385" r="22" fill="#FF715B" />
      <circle cx="281" cy="385" r="22" fill="#F3C64F" />
      <circle cx="349" cy="385" r="22" fill="#FF715B" />
      <circle cx="145" cy="333" r="22" fill="#FF715B" />
      <circle cx="213" cy="333" r="22" fill="#F3C64F" />
      <circle cx="281" cy="333" r="22" fill="#FF715B" />
      <circle cx="213" cy="281" r="22" fill="#FF715B" />
    </g>
    <text x="34" y="460" fill="#56645F" font-family="Inter, Arial, sans-serif" font-size="15">Moves • 9</text>
    <text x="526" y="460" text-anchor="end" fill="#56645F" font-family="Inter, Arial, sans-serif" font-size="15">Open • 33</text>
  </g>

  <g transform="translate(78 616)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect width="394" height="92" rx="20" fill="#FFFFFF" />
      <circle cx="40" cy="46" r="18" fill="#D7F2E8" />
      <path d="M31 46h18M40 37v18" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />
      <text x="72" y="38" fill="#15231F" font-size="16" font-weight="750">PURE RULES ENGINE</text>
      <text x="72" y="62" fill="#56645F" font-size="14">Gravity, wins, draw, undo, legal moves</text>
    </g>
    <g transform="translate(418 0)">
      <rect width="394" height="92" rx="20" fill="#FFFFFF" />
      <circle cx="40" cy="46" r="18" fill="#FFE5DD" />
      <path d="M32 51l6 -10l6 6l7 -12" fill="none" stroke="#C84A36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="72" y="38" fill="#15231F" font-size="16" font-weight="750">LIFECYCLE-AWARE STATE</text>
      <text x="72" y="62" fill="#56645F" font-size="14">ViewModels retain profiles and live boards</text>
    </g>
    <g transform="translate(836 0)">
      <rect width="394" height="92" rx="20" fill="#FFFFFF" />
      <circle cx="40" cy="46" r="18" fill="#FFF3C8" />
      <path d="M32 46h16M35 40v12M45 40v12" stroke="#786000" stroke-width="3" stroke-linecap="round" />
      <text x="72" y="38" fill="#15231F" font-size="16" font-weight="750">LOCAL BY DESIGN</text>
      <text x="72" y="62" fill="#56645F" font-size="14">No account, network, or personal-data backup</text>
    </g>
